<!-- Lab Test Request Modal -->
<div class="modal fade" id="testRequestModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header py-2 border-bottom">
                <h5 class="modal-title fw-bold" style="font-size:.95rem;">
                    <i class="bi bi-flask text-primary me-2"></i>Request Laboratory Test
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <form data-modal-form method="post" action="{% url 'laboratory:labtest_request_bulk' %}" id="testRequestForm">
                    {% csrf_token %}
                    <div class="row g-0">
                        <!-- Left: Test & Clinical Details -->
                        <div class="col-md-7 p-3 border-end">
                            <p class="fw-semibold text-uppercase text-muted mb-2" style="font-size:.72rem;letter-spacing:.5px;">Test Details</p>
                            <div class="mb-2">
                                <label class="form-label form-label-sm fw-semibold mb-1">Patient <span class="text-danger">*</span></label>
                                <select class="form-select form-select-sm" id="tr_patient" name="patient" required>
                                    <option value="">Select a patient</option>
                                    {% for p in patients %}
                                    <option value="{{ p.id }}" data-group-id="{{ p.patient_group_id|default:'' }}" data-group-name="{{ p.patient_group.name|default:'' }}">
                                        {{ p.get_full_name }} ({{ p.patient_id }})
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-2">
                                <label class="form-label form-label-sm fw-semibold mb-1">Tests <span class="text-danger">*</span></label>
                                <input type="text" id="tr_test_search" class="form-control form-control-sm mb-1" placeholder="Search tests...">
                                <div id="tr_test_list" style="max-height:150px;overflow-y:auto;border:1px solid #dee2e6;border-radius:6px;padding:6px;">
                                    {% for t in lab_tests %}
                                    <label class="d-flex align-items-center gap-2 px-2 py-1 rounded tr-test-item" style="cursor:pointer;font-size:.82rem;" data-name="{{ t.name|lower }}">
                                        <input type="checkbox" name="tests" value="{{ t.id }}" class="form-check-input mt-0 tr-test-cb" data-price="{{ t.price }}" data-currency="{{ t.currency }}" data-test-name="{{ t.name }}">
                                        <span class="flex-grow-1">{{ t.name }} <small class="text-muted">({{ t.code }})</small></span>
                                        <span class="badge bg-light text-dark border" style="font-size:.72rem;">{{ t.currency }} {{ t.price }}</span>
                                    </label>
                                    {% endfor %}
                                </div>
                                <div id="tr_selected_count" class="mt-1 text-muted" style="font-size:.72rem;">0 tests selected</div>
                            </div>
                            <div class="row g-2 mb-2">
                                <div class="col-6">
                                    <label class="form-label form-label-sm fw-semibold mb-1">Priority</label>
                                    <select class="form-select form-select-sm" name="priority">
                                        <option value="routine">Routine</option>
                                        <option value="urgent">Urgent</option>
                                        <option value="stat">STAT</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label form-label-sm fw-semibold mb-1">Sample ID</label>
                                    <input type="text" class="form-control form-control-sm" name="sample_id" placeholder="Optional">
                                </div>
                            </div>
                            <div class="mb-2">
                                <label class="form-label form-label-sm fw-semibold mb-1">Reason for Test <span class="text-danger">*</span></label>
                                <textarea class="form-control form-control-sm" name="reason_for_test" rows="2" placeholder="Clinical indication..." required></textarea>
                            </div>
                            <div class="mb-2">
                                <label class="form-label form-label-sm fw-semibold mb-1">Samples Required</label>
                                <input type="text" class="form-control form-control-sm" name="samples_required" placeholder="e.g., Blood, Urine, Stool">
                            </div>
                            <div class="mb-0">
                                <label class="form-label form-label-sm fw-semibold mb-1">Clinical Notes <small class="text-muted fw-normal">(optional)</small></label>
                                <textarea class="form-control form-control-sm" name="clinical_notes" rows="2" placeholder="Additional clinical information"></textarea>
                            </div>
                        </div>
                        <!-- Right: Selected Tests & Pricing -->
                        <div class="col-md-5 p-3" style="background:#f8fafc;">
                            <p class="fw-semibold text-uppercase text-muted mb-2" style="font-size:.72rem;letter-spacing:.5px;">Selected Tests &amp; Pricing</p>
                            <div id="tr_selected_summary" style="max-height:140px;overflow-y:auto;font-size:.82rem;">
                                <p class="text-muted fst-italic" style="font-size:.78rem;">No tests selected yet</p>
                            </div>
                            <hr class="my-2">
                            <div class="d-flex justify-content-between fw-bold" style="font-size:.9rem;">
                                <span>Total</span>
                                <span id="tr_total_price">UGX 0</span>
                            </div>
                            <hr class="my-2">
                            <!-- Group Override -->
                            <div class="mb-3">
                                <label class="form-label form-label-sm fw-semibold mb-1">Patient Group Override</label>
                                <select class="form-select form-select-sm" id="tr_override_group" name="override_group_id">
                                    <option value="">Auto (from patient profile)</option>
                                    {% for g in patient_groups %}
                                    <option value="{{ g.id }}">{{ g.name }}</option>
                                    {% endfor %}
                                </select>
                                <small id="trGroupHint" class="text-muted d-block mt-1" style="font-size:.72rem;">Select patient to see their group</small>
                            </div>
                            <!-- Discount -->
                            <div class="mb-2">
                                <label class="form-label form-label-sm fw-semibold mb-1">Discount</label>
                                <div class="d-flex flex-wrap gap-3 mb-2">
                                    <div class="form-check form-check-sm">
                                        <input class="form-check-input" type="radio" name="discount_type" id="tr_disc_none" value="none" checked>
                                        <label class="form-check-label" for="tr_disc_none" style="font-size:.82rem;">None</label>
                                    </div>
                                    <div class="form-check form-check-sm">
                                        <input class="form-check-input" type="radio" name="discount_type" id="tr_disc_pct" value="percentage">
                                        <label class="form-check-label" for="tr_disc_pct" style="font-size:.82rem;">Percentage (%)</label>
                                    </div>
                                    <div class="form-check form-check-sm">
                                        <input class="form-check-input" type="radio" name="discount_type" id="tr_disc_flat" value="flat">
                                        <label class="form-check-label" for="tr_disc_flat" style="font-size:.82rem;">Flat Amount</label>
                                    </div>
                                </div>
                                <div id="trDiscountValueWrap" style="display:none;">
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text" id="trDiscSymbol">%</span>
                                        <input type="number" class="form-control form-control-sm" id="tr_discount_value" name="discount_value" min="0" step="0.01" value="" placeholder="0">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer py-2 border-top">
                <span id="tr_footer_count" class="me-auto text-muted" style="font-size:.78rem;">0 tests selected</span>
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" form="testRequestForm" class="btn btn-primary btn-sm px-4" id="tr_submit_btn" disabled>
                    <i class="bi bi-check-circle me-1"></i>Request Tests
                </button>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    document.addEventListener('DOMContentLoaded', function () {
        var checkboxes = document.querySelectorAll('.tr-test-cb');
        var searchInput = document.getElementById('tr_test_search');
        var summaryDiv = document.getElementById('tr_selected_summary');
        var totalEl = document.getElementById('tr_total_price');
        var countEl = document.getElementById('tr_selected_count');
        var footerCountEl = document.getElementById('tr_footer_count');
        var submitBtn = document.getElementById('tr_submit_btn');
        var discWrap = document.getElementById('trDiscountValueWrap');
        var discSym = document.getElementById('trDiscSymbol');
        var discValInp = document.getElementById('tr_discount_value');
        var patSel = document.getElementById('tr_patient');
        var hint = document.getElementById('trGroupHint');

        function updateSummary() {
            var selected = document.querySelectorAll('.tr-test-cb:checked');
            var count = selected.length;
            var total = 0;
            var html = '';
            selected.forEach(function (cb) {
                var price = parseFloat(cb.dataset.price) || 0;
                var currency = cb.dataset.currency || 'UGX';
                var name = cb.dataset.testName || '';
                total += price;
                html += '<div class="d-flex justify-content-between border-bottom py-1"><span>' + name + '</span><span class="fw-semibold">' + currency + ' ' + price.toFixed(1) + '</span></div>';
            });
            if (count === 0) {
                summaryDiv.innerHTML = '<p class="text-muted fst-italic" style="font-size:.78rem;">No tests selected yet</p>';
                totalEl.textContent = 'UGX 0';
            } else {
                summaryDiv.innerHTML = html;
                totalEl.textContent = 'UGX ' + total.toFixed(1);
            }
            var label = count + ' test' + (count !== 1 ? 's' : '') + ' selected';
            if (countEl) countEl.textContent = label;
            if (footerCountEl) footerCountEl.textContent = label;
            if (submitBtn) submitBtn.disabled = count === 0;
        }

        checkboxes.forEach(function (cb) {
            cb.addEventListener('change', function () {
                var lbl = this.closest('.tr-test-item');
                if (lbl) lbl.style.background = this.checked ? '#e6f1fa' : '';
                updateSummary();
            });
        });

        if (searchInput) {
            searchInput.addEventListener('input', function () {
                var q = this.value.toLowerCase();
                document.querySelectorAll('.tr-test-item').forEach(function (item) {
                    item.style.display = item.dataset.name.indexOf(q) >= 0 ? '' : 'none';
                });
            });
        }

        // Patient selector: update group hint
        if (patSel) {
            patSel.addEventListener('change', function () {
                var opt = this.options[this.selectedIndex];
                var gName = opt ? opt.dataset.groupName : '';
                if (hint) {
                    if (gName) {
                        hint.textContent = 'Patient group: ' + gName;
                        hint.className = 'text-primary d-block mt-1';
                    } else if (this.value) {
                        hint.textContent = 'No group — default price applies';
                        hint.className = 'text-muted d-block mt-1';
                    } else {
                        hint.textContent = 'Select patient to see their group';
                        hint.className = 'text-muted d-block mt-1';
                    }
                    hint.style.fontSize = '.72rem';
                }
            });
        }

        // Discount toggle
        document.querySelectorAll('#testRequestModal input[name="discount_type"]').forEach(function (r) {
            r.addEventListener('change', function () {
                if (this.value === 'none') {
                    if (discWrap) discWrap.style.display = 'none';
                    if (discValInp) discValInp.value = '';
                } else {
                    if (discWrap) discWrap.style.display = 'block';
                    if (discSym) discSym.textContent = this.value === 'percentage' ? '%' : 'UGX';
                    if (discValInp && this.value === 'percentage') {
                        discValInp.max = '100'; discValInp.placeholder = '0-100';
                    } else if (discValInp) {
                        discValInp.removeAttribute('max'); discValInp.placeholder = '0';
                    }
                }
            });
        });

        // Intercept form submit for AJAX
        var form = document.getElementById('testRequestForm');
        if (form) {
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var selected = document.querySelectorAll('.tr-test-cb:checked');
                if (selected.length === 0) { alert('Please select at least one test.'); return; }
                if (!patSel || !patSel.value) { alert('Please select a patient.'); return; }
                var fd = new FormData(form);
                fetch(form.action, {
                    method: 'POST', body: fd,
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                })
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    if (d.success) {
                        var modal = bootstrap.Modal.getInstance(document.getElementById('testRequestModal'));
                        if (modal) modal.hide();
                        alert(d.message);
                        window.location.reload();
                    } else {
                        alert(d.message || 'Error requesting lab tests.');
                    }
                })
                .catch(function () { alert('An error occurred. Please try again.'); });
            });
        }
    });
}());
</script>
