<!-- Drug Add/Edit Modal -->
<div class="modal fade" id="drugModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-capsule"></i> <span id="drugModalTitle">Add Drug</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form data-modal-form method="post" action="{% url 'inventory:drug_add' %}" id="drugForm">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Drug Name *</label>
                            {{ form.name }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">ATC Code</label>
                            {{ form.atc_code }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Manufacturer</label>
                            {{ form.manufacturer }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Supplier</label>
                            {{ form.supplier }}
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Quantity *</label>
                            {{ form.quantity }}
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Unit Price *</label>
                            {{ form.unit_price }}
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Currency</label>
                            {{ form.currency }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Batch Number</label>
                            {{ form.batch_number }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Expiry Date</label>
                            {{ form.expiry_date }}
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            {{ form.description }}
                        </div>
                    </div>
                    <div class="modal-footer mt-3">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Save Drug
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
